name: Linux build
on:
  workflow_call:
    inputs:
      repository:
        default: ${{ github.repository }}
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
      boost_libs: regex
    
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}

      - name: Set Boost environment
        run: |
          boost_version="$(awk -F= '$1=="version"{sub(/\r$/,"",$2); print $2; exit}' boost-data.txt)"
          if [[ -z "$boost_version" ]]; then
            echo "missing version= entry in boost-data.txt" >&2
            exit 1
          fi
          echo "boost_version=$boost_version" >> $GITHUB_ENV
          echo "BOOST_ROOT=${{ github.workspace }}/deps/boost-$boost_version" >> $GITHUB_ENV

      - name: Install dependency
        run: ./action-install-linux.sh

      - name: Build and test
        run: make test
        env:
          CMAKE_GENERATOR: Ninja
